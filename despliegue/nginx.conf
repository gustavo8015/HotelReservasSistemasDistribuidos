# Pasarela del cliente web.
#
# Cumple dos papeles. Sirve los archivos estáticos del cliente Blazor WebAssembly, y reenvía al
# servicio de la API todo lo que empiece por /api o por /health. Como el navegador habla con un
# solo origen, no hace falta habilitar CORS y el cliente no necesita conocer la dirección
# interna de la API: en el despliegue con contenedores ApiUrl queda vacío y el cliente usa su
# propio origen.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los archivos del cliente, que en Blazor WebAssembly pesan varios megabytes.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # El motor de WebAssembly no se ejecuta si el tipo de contenido no es el correcto.
    types {
        application/wasm wasm;
    }

    location /api/ {
        proxy_pass         http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Tiempos acotados: si la API no responde, la pasarela corta y el interruptor de
        # circuito del cliente se entera, en lugar de dejar la petición colgada.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    location /health {
        proxy_pass       http://api:8080;
        proxy_set_header Host $host;
    }

    # Rutas propias del cliente (/reservar/2, /mis-reservas): se devuelve el documento de la
    # aplicación y ella resuelve la ruta en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
